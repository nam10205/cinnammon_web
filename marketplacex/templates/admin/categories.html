{% extends "base.html" %}
{% block content %}{% include "admin/_nav.html" %}
{% macro row(c, depth=0) %}
<tr><form method="post"><input type="hidden" name="id" value="{{ c.id }}">
  <td style="padding-left:{{ depth * 1.5 + 0.5 }}rem"><input class="form-control form-control-sm" name="name" value="{{ c.name }}" aria-label="Name"></td>
  <td><input class="form-control form-control-sm" name="attribute_schema" value="{{ c.attribute_schema|join(', ') }}" aria-label="Required attributes"></td>
  <td><input type="hidden" name="parent_id" value="{{ c.parent_id or '' }}"><input class="form-control form-control-sm" name="reason" placeholder="Reason" aria-label="Reason" required></td>
  <td class="text-nowrap"><button class="btn btn-sm btn-outline-primary" name="action" value="save">Save</button> <button class="btn btn-sm btn-outline-danger" name="action" value="delete">Delete</button></td></form></tr>
{% for ch in c.children %}{{ row(ch, depth + 1) }}{% endfor %}
{% endmacro %}
<table class="table table-sm bg-white align-middle"><thead><tr><th>Category</th><th>Required attributes</th><th>Reason</th><th></th></tr></thead><tbody>{% for c in tree %}{{ row(c) }}{% endfor %}</tbody></table>
<form method="post" class="card card-body" style="max-width:640px"><h2 class="h6">New category</h2>
  <div class="d-flex flex-wrap gap-2"><input class="form-control form-control-sm" name="name" placeholder="Name" aria-label="Name" required style="max-width:160px">
  <select class="form-select form-select-sm" name="parent_id" aria-label="Parent" style="max-width:160px"><option value="">(top level)</option>{% for c in tree %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select>
  <input class="form-control form-control-sm" name="attribute_schema" placeholder="size, color" aria-label="Required attributes" style="max-width:160px">
  <input class="form-control form-control-sm" name="reason" placeholder="Reason" aria-label="Reason" required style="max-width:160px">
  <button class="btn btn-sm btn-primary">Add</button></div></form>
{% endblock %}

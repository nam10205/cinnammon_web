{% macro product_card(p) %}
<div class="col">
  <a class="card h-100 text-decoration-none text-body" href="/products/{{ p.id }}">
    {% if p.image_url %}
    <img src="{{ p.image_url }}" class="card-img-top" alt="{{ p.title }}" loading="lazy" style="aspect-ratio:1/1;object-fit:contain">
    {% else %}
    <div class="card-img-top bg-light d-flex align-items-center justify-content-center text-muted" style="aspect-ratio:1/1"><i class="bi bi-image fs-1"></i></div>
    {% endif %}
    <div class="card-body">
      <div class="small text-muted">{{ p.brand }}</div>
      <div class="card-title h6">{{ p.title }}</div>
      <div class="fw-bold text-danger">{{ p.price|vnd }}</div>
      <div class="small text-warning"><i class="bi bi-star-fill"></i> {{ '%.1f'|format(p.avg_rating or 0) }}</div>
    </div>
  </a>
</div>
{% endmacro %}

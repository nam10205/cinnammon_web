{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card shadow-sm"><div class="card-body">
  <h1 class="h4 mb-3">Create account</h1>
  <form method="post">
    <div class="mb-2"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" required></div>
    <div class="mb-2"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" required></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" minlength="6" required></div>
    <button class="btn btn-primary w-100">Register</button>
  </form>
</div></div></div></div>
{% endblock %}

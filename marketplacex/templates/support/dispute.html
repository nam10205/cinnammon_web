{% extends "base.html" %}
{% block content %}{% include "support/_nav.html" %}
<div class="row g-4">
  <div class="col-lg-7">{% include "_case_summary.html" %}{% include "_case_timeline.html" %}</div>
  <div class="col-lg-5">
  {% if c.status == 'disputed' and not c.decision %}
    <form method="post" action="{{ url_for('support.decide', case_id=c.id) }}" class="card card-body vstack gap-2"><h3 class="h6">Platform decision (immutable)</h3>
      <select class="form-select form-select-sm" name="outcome" aria-label="Outcome"><option value="refund_customer">Refund customer in full ({{ amount|vnd }})</option><option value="partial">Partial refund</option><option value="side_with_seller">Side with seller</option></select>
      <input class="form-control form-control-sm" name="amount_vnd" type="number" min="1" placeholder="Partial amount ₫" aria-label="Partial amount">
      <select class="form-select form-select-sm" name="reason_code" aria-label="Reason code">{% for r in ['SELLER_FAULT','ITEM_NOT_AS_DESCRIBED','COUNTERFEIT_CONFIRMED','EVIDENCE_INSUFFICIENT','CUSTOMER_MISUSE','GOODWILL'] %}<option>{{ r }}</option>{% endfor %}</select>
      <textarea class="form-control form-control-sm" name="note" placeholder="Decision note" aria-label="Decision note"></textarea>
      <button class="btn btn-primary btn-sm">Record decision</button></form>
  {% else %}<div class="alert alert-secondary">This case is {{ c.status }}.</div>{% endif %}
  </div>
</div>
{% endblock %}

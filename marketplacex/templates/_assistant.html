<div id="mx-assistant" class="mx-assistant">
  <button type="button" class="mx-assistant-toggle btn btn-primary rounded-circle shadow" aria-controls="mx-assistant-panel" aria-expanded="false" aria-label="Open shopping assistant"><i class="bi bi-chat-dots-fill fs-4"></i></button>
  <section id="mx-assistant-panel" class="mx-assistant-panel card shadow" hidden aria-label="Shopping assistant">
    <div class="card-header d-flex align-items-center gap-2 mx-assistant-head">
      <i class="bi bi-stars"></i><strong class="me-auto">Shopping assistant</strong>
      <button type="button" class="btn btn-sm btn-link text-white p-0 mx-assistant-clear" title="Clear conversation" aria-label="Clear conversation"><i class="bi bi-trash3"></i></button>
      <button type="button" class="btn-close btn-close-white mx-assistant-close" aria-label="Close"></button>
    </div>
    <div class="card-body mx-assistant-log" aria-live="polite"></div>
    <form class="card-footer d-flex gap-2 bg-white mx-assistant-form">
      <input class="form-control form-control-sm" name="message" maxlength="1000" autocomplete="off" placeholder="Ask about products or your orders…" aria-label="Your question" required>
      <button class="btn btn-sm btn-primary" aria-label="Send"><i class="bi bi-send"></i></button>
    </form>
  </section>
</div>
<script src="{{ url_for('static', filename='js/assistant.js') }}"></script>

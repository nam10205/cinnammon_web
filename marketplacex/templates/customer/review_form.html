{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card"><div class="card-body">
  <h1 class="h5">Review: {{ item.title_snapshot }}</h1>
  <p class="small text-muted">Verified purchase from order #{{ o.id }} · {{ o.shop.name }}</p>
  <form method="post">
    <fieldset class="mb-2"><legend class="form-label fs-6">Rating</legend>
      {% for n in range(5, 0, -1) %}<label class="form-check form-check-inline"><input class="form-check-input" type="radio" name="rating" value="{{ n }}" {{ 'checked' if n == 5 }} required> {{ '★' * n }}</label>{% endfor %}
    </fieldset>
    <label class="form-label" for="comment">Comment</label>
    <textarea class="form-control mb-3" id="comment" name="comment" rows="3" maxlength="1000"></textarea>
    <button class="btn btn-primary">Submit review</button>
  </form>
</div></div></div></div>
{% endblock %}

{% extends "base.html" %}
{% from "_cards.html" import product_card %}
{% block content %}
{% for c, items in sections %}
<section class="mb-5">
  <div class="d-flex justify-content-between align-items-baseline mb-3">
    <h2 class="h4 mb-0">{{ c.name }}</h2>
    <a href="/categories/{{ c.id }}">See all</a>
  </div>
  <div class="row row-cols-2 row-cols-md-4 g-3">{% for p in items %}{{ product_card(p) }}{% endfor %}</div>
</section>
{% else %}
<p class="text-muted">No products yet.</p>
{% endfor %}
{% endblock %}
